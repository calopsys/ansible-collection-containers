---
- name: Converge
  hosts: instance
  become: true
  tasks:
    - name: "Import podman role"
      ansible.builtin.import_role:
        name: calopsys.containers.podman
      vars:
        calopsys_podman_user: "testuser"
        calopsys_podman_uid: "1100"
        calopsys_podman_gid: "1100"

    - name: "Deploy test application"
      ansible.builtin.import_role:
        name: calopsys.containers.podman
        tasks_from: application.yml
      vars:
        calopsys_podman_user: "testuser"
        calopsys_podman_application_name: "testapp"
        calopsys_podman_application_compose_template: "test.compose.yml.j2"
        calopsys_podman_application_directories:
          - name: config
        calopsys_podman_application_files:
          - src: "test-app-env.j2"
            dest: "config/app.env"
            mode: "0640"
          - src: "test-app-config.j2"
            dest: "config/app.config"
            container_uid: "999"
