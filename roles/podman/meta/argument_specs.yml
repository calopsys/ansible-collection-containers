---
argument_specs:
  main:
    short_description: "Installs and configures the podman rootless base on a Debian system."
    options:
      calopsys_podman_unprivileged_port_start:
        type: "str"
        description: "Port number to pass to sysctl net.ipv4.ip_unprivileged_port."
      calopsys_podman_user:
        type: "str"
        description: "The unix user that will be configured to manage the podman rootless containers."
        required: true
      calopsys_podman_group:
        type: "str"
        description: "The unix group of calopsys_podman_user."
        default: "{{ calopsys_podman_user }}"
      calopsys_podman_home:
        type: "str"
        description: "The home of calopsys_podman_user."
        default: "/opt/{{ calopsys_podman_user }}"
      calopsys_podman_uid:
        type: "int"
        description: "A custom UID for calopsys_podman_user."
      calopsys_podman_gid:
        type: "int"
        description: "A custom GID for calopsys_podman_group."
      calopsys_podman_containers_config_template:
        type: "str"
        description:
          - "Local path to the template for the containers.conf configuration file."
          - "This file will be put under calopsys_podman_user homedir."
        default: "containers.conf.j2"
      calopsys_podman_tz:
        type: "str"
        description: "Sets the default timezone for all containers, in the default containers.conf template."
        default: "UTC"
      calopsys_podman_compose_version:
        type: "str"
        description:
          - "The Debian package version of podman-compose that the role installs."
          - "The role fetches the package from snapshot.debian.org, which keeps every version that entered the Debian archive."
          - "Versions 1.5.0 and later exec a `CMD` healthcheck without `/bin/sh`, which images without a shell need. Trixie ships 1.3.0."
        # The role turns the version into a file hash with
        # https://snapshot.debian.org/mr/binary/podman-compose/<version>/binfiles,
        # then downloads https://snapshot.debian.org/file/<hash>.
        # renovate: datasource=deb depName=podman-compose versioning=deb
        default: "1.6.0-1"
      calopsys_podman_compose_deb_url:
        type: "str"
        description:
          - "The URL of a podman-compose Debian package to install instead of the snapshot.debian.org file."
          - "Set it with `calopsys_podman_compose_deb_checksum` when the hosts have no access to snapshot.debian.org. The package must have the version `calopsys_podman_compose_version`."
        default: ""
      calopsys_podman_compose_deb_checksum:
        type: "str"
        description:
          - "The checksum of the package at `calopsys_podman_compose_deb_url`, in the `get_url` format, for example `sha256:<hex>`."
          - "Required when `calopsys_podman_compose_deb_url` is set."
        default: ""
      calopsys_podman_registries:
        type: "list"
        elements: "dict"
        description: "List of container registries to connect to podman user onto."
      calopsys_podman_registries_config_template:
        type: "str"
        description: "The ansible template for registries.conf. See https://github.com/containers/image/blob/main/docs/containers-registries.conf.5.md"
      calopsys_podman_application_name:
        type: "str"
        description:
          - "The name of the application to deploy."
          - "This is used mainly for the systemd unit filename and the default application_dir."
        default: ""
      calopsys_podman_application_dir:
        type: "str"
        description: "The base directory to deploy the application compose to."
        default: "{{ calopsys_podman_home }}/{{ calopsys_podman_application_name }}"
      calopsys_podman_application_dir_mode:
        type: "str"
        description: "The permissions to apply to the base directory to deploy the application compose to."
        default: "0750"
      calopsys_podman_application_directories:
        type: "list"
        elements: "dict"
        description:
          - "Additional directories for files needed for deployment."
          - "Will be used to put `calopsys_podman_application_files` inside."
      calopsys_podman_application_files:
        type: "list"
        elements: "dict"
        description:
          - "Additional files needed for deployment."
          - "Could be an env file, a configuration file mounted in the container or anything else."
          - "If in a subdirectory, the directory has to be created with `calopsys_podman_application_directories` first"
      calopsys_podman_application_compose_template:
        type: "str"
        description: "Local path to the docker compose template for the application."
      calopsys_podman_application_restart_policy:
        type: "str"
        description: "The restart policy to apply to the systemd unit of the application."
        default: "on-abnormal"
        choices:
          - "no"
          - "on-success"
          - "on-failure"
          - "on-abnormal"
          - "on-watchdog"
          - "on-abort"
          - "always"
      calopsys_podman_application_rollback_enabled:
        type: "bool"
        description: "Whether or not to trigger the rollback tasks if the deployment fails."
        default: false
      calopsys_podman_application_timeout:
        type: "int"
        description: "The timeout for starting the application compose."
        default: 300
